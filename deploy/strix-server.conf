# strix-server's served settings, read by deploy/strix-server.service through --config. Every tuning option is listed
# here with the reason for its value. The built-in defaults are these same values (the defaults are what a dedicated
# headless Strix Halo serving a coding agent runs): change a value here and its built-in default together.
# The model files are the exception: their paths default under $STRIX_MODELS_DIR (default ~/models/strix-infer) and
# can be set here or as flags.
#
# Syntax: key = value, # comments; keys are strix_server's flag names without --. Paths must be absolute.
# Precedence: built-in default < this file < command-line flag. `strix_server --help` lists every option with its
# default and range; `strix_server --config deploy/strix-server.conf --print-config` prints the effective settings.
# The startup log has one "startup: config KEY = VALUE (SOURCE)" line per option.
#
# Not here: `weights` - the unit passes --weights ${STRIX_WEIGHTS}, so a systemd drop-in can switch layouts.
#
# After editing: systemctl --user restart strix-server.service (no daemon-reload needed for this file).

# --- model files ---
# Defaults, under $STRIX_MODELS_DIR: ngram = converted/Qwen3.8-Flash-Next.ngram-q8/ngram.table (the int8 n-gram table),
# tokenizer = Qwen3.8-Flash-Next/tokenizer.json, generation-config = Qwen3.8-Flash-Next/generation_config.json (the
# sampling defaults - temperature 1.0, top_k 20, top_p 0.95 - when a request doesn't set them). Set any of them here
# as an absolute path to override.
model-id = qwen3.8-flash-next

# --- HTTP ---
host = 0.0.0.0
port = 5300

# --- forward ---
# Positions per session: 512k with YaRN factor 2 (below). Real agent sessions reach 490k with decode speed flat to
# that depth. ~13 GiB of KV + indexer keys at 512k.
capacity = 524288
# YaRN context extension, always on (kernels/rope.hpp rope_yarn): 262,144 trained positions x 2. Quality at ordinary
# lengths measured no worse (NLL within noise, long-context retrieval better), no speed cost. Changing it drops the
# prompt cache's entries made under the other setting.
rope-yarn-factor = 2
# Prefill in 16384-token forwards: ~+3% prefill speed vs 8192 on 65k / 131k-token prompts (earlier steps: 4096 -> 8192
# ~+5%, 2048 -> 4096 ~+8%), same output. The weights are read once a chunk; progress and cancellation are checked per
# chunk (~25 s at depth). 16384 is the session's maximum (32768 would pass 2^31 bytes in the experts' partials and
# needs the QSA scores sliced).
chunk = 16384

# --- Precision / speed ---
# The prefill delta rule's products: half-u = F16 products, the state-carrying ones (U and the state update) as F16
# hi + lo pairs and Q / K staged exactly (~3% faster prefill at 120k than exact; GDN state error ~9e-6, exact's level);
# exact = BF16 hi + lo (near the FP32 recurrence); half = one F16 product everywhere (~4% faster, state error ~4e-4,
# fewer MTP drafts accepted); fast = one BF16 product (state error ~3e-3).
gdn-precision = half-u
# The prefill attention's P * V: exact (P as BF16 hi + lo, the default) or fast (P as one BF16 term).

# --- K/V cache ---
# The attention layers' K/V in 8 bits (layout c: per-channel K over 32-token groups, V per 32-value block): ~56% of
# bf16's memory - at 512k one full state is 8.3 GiB instead of 13.5 (K/V 6.75 instead of 12.0 GiB), and prompt-cache
# entries are ~40% smaller.
# q8h = 8-bit cache with Walsh-Hadamard rotated Q/K to suppress channel outliers; q8 = plain 8-bit; bf16 = full precision.
kv-cache = q8h

# --- MTP drafting ---
mtp = on
# 7 drafts (was 5): ~1-6% faster decode on coding-agent work, most on short contexts.
mtp-draft = 7
# Draft while the top-1 logit margin is >= 1.5 (was 2.0): ~1.4% faster decode on coding-agent work, ~0.35% slower
# on short mixed chat.
mtp-margin = 1.5
# Drafts scored over token ids [0, 65536): the common tokens, at a quarter of the full vocabulary's cost.
mtp-vocab = 65536

# --- PLE n-gram row cache ---
# 8 M rows, ~2.7 GB of rows + ~0.5 GB of index (the library default 2^18 rows is ~84 MB): several long agent sessions'
# worth (1.2-2.3 M distinct rows each), for reuse across sessions. Denser than the page cache it partly replaces
# (320 B rows vs 4 KiB pages). Restart cost negligible.
ngram-cache-rows = 8388608

# --- prompt cache ---
# Directory: default $STRIX_MODELS_DIR/prompt-cache (prompt-cache-dir to override).
# Disk cap in GiB (0 = no prompt cache). The entries are the server's own: safe to delete while it is stopped.
prompt-cache-gib = 128
# Keep MemAvailable above 4 GiB. At 512k capacity the server holds ~96 GiB of GPU memory, so a larger margin (24 GiB
# before) left the RAM tier empty from startup. 4 = kernel watermarks + services + room for one build; with two 264k
# conversations switching, the lowest MemAvailable stayed at 5.5 GiB with no compaction stalls and RAM resumes of
# 1.2-1.4 s. 4 assumes the machine is dedicated to the server; one that also runs a desktop or another model: see
# strixite's Memory guide.
prompt-cache-ram-margin-gib = 4
# Disk writes kept low (a power failure losing the RAM tier - a longer first prefill after it - is acceptable). The RAM
# tier serves switches; the disk mostly matters across restarts, and a clean stop still writes the newest entries.
# An entry idle in RAM this long is written to disk (and kept in RAM): 1 h.
prompt-cache-idle-s = 3600
# Disk write budget for eviction and idle writes (0 = no limit): 32 GiB/h. With two deep agents at once, a lower
# budget dropped entries and forced long re-prefills; delta entries (below) keep most writes small.
prompt-cache-write-gib-per-hour = 32
# A cache write never leaves less than this free on the cache's filesystem.
prompt-cache-disk-free-gib = 32
# Checkpoints kept per conversation.
prompt-cache-checkpoints = 2
# Delta entries: a turn saves only what changed since the whole entry it extends while it adds <= 65536 tokens (and
# <= a quarter of that base): ~27 KiB a token + ~0.12 GB, vs the whole state every turn (11.5 GB at 410k). The quarter
# rule decides below a 262k base (a delta of <= ~1.4 GB there).
prompt-cache-delta-max-tokens = 65536

# --- serving behaviour ---
# The thinking nudge into a think block going in circles (serve/think_nudge.hpp). Set off only for like-for-like
# comparisons with engines that don't have it.
think-nudge = on
# The think-block guard: <|im_end|> / <|endoftext|> are never sampled while the think block or a tool call is open.
# Without it the model ended turns mid thought when it meant to name a tag in inline code (`</tool_call>`), with
# P(end of turn) 0.91-0.9997 right after the backtick - and mid call, writing code like id_of("<|im_end|>") into an
# edit. Off only for like-for-like comparisons.
think-end-guard = on
# Literal tags: a </think> / <tool_call> / </tool_call> token not right after a newline is text, not structure. The
# model has no text spelling for its tags; in served requests every such tag not after a newline was a literal
# (`id_of("<tool_call>")` in code, a tag named in a sentence), and every structural one followed a newline.
literal-tags = on
# Think close before a call: a <tool_call> the model begins right after a newline inside the think block gets
# </think>\n\n fed ahead of it, so the call runs. Without it the call is reasoning text: one turn wrote 52 calls into its
# thinking, nothing ran, and the client cancelled it after ~5k thinking tokens. Off only for like-for-like comparisons.
think-close-on-call = on
# When it fires: at least 25% of the last 1024 thinking tokens repeat earlier 8-grams, from 3072 thinking tokens on.
# It fires in a few percent of agent requests and mostly ends the thinking within ~1.4k tokens. Nudging earlier (10%
# from 1024) was mostly ignored; a length-only trigger was removed (ignored, or it made the model answer inside the
# think block).
think-nudge-rate = 0.25
think-nudge-min-tokens = 3072
# Nudge 1's text: commit ("... commit to the most promising approach now and act on it"). decide ("... state my
# decision and the exact next command") ended thinking more often, but also wrote the answer inside the think block
# more often.
think-nudge-wording = commit
# Thinking for requests that don't say: on (the model's default). off renders them without the think block - on agent
# tasks that took 4-7x the steps and was no faster.
thinking = on
# Thinking cap: requests that set no thinking budget of their own think at most this many tokens; then the engine
# feeds Qwen's budget stop ("Considering the limited time by the user, ...") and the model answers. 0 = no cap. A
# request's own budget always wins (and stops exactly at it).
thinking-cap = 0
# Past the cap the engine waits for the end of a sentence (a newline, or . ! ? outside inline code) before it feeds the
# stop, for at most this many more thinking tokens; 0 = stop right at the cap.
thinking-cap-grace = 256
# Image input (PNG, JPEG, WebP, GIF, BMP, TGA as data: URLs): needs vision.strixw next to the weights and the
# checkpoint's preprocessor_config.json; with either missing the server refuses to start and names the file. off = text
# only (image parts are a 400, no tower loaded).
vision = on
# How many images may decode / resize / pack at once (on the request threads; each one's worst case is a few
# hundred MB of transient host RAM): an image request past the limit is refused with a retryable 503, never
# queued into a memory spike.
vision-preprocess-limit = 2
# Captures (capture-dir, serve/capture.hpp): every request's token ids and MTP steps, for offline analysis. Off unless
# set; the files hold the prompts, so they stay on the serving machine.
