# strix-server's served settings, read by deploy/strix-server.service through --config. Every tuning option is listed
# here with the reason for its value. Since 2026-10-10 the built-in defaults are these same values (the defaults are
# what a dedicated headless Strix Halo serving a coding agent runs), and the test server_config_conf_equals_defaults
# fails if a value here and its built-in default differ: change both together. The model files are the exception: their paths default under
# $STRIX_MODELS_DIR (default ~/models/strix-infer) and can be set here or as flags.
#
# Syntax: key = value, # comments; keys are strix_server's flag names without --. Paths must be absolute.
# Precedence: built-in default < this file < command-line flag. `strix_server --help` lists every option with its
# default and range; `strix_server --config deploy/strix-server.conf --print-config` prints the effective settings.
# The startup log has one "startup: config KEY = VALUE (SOURCE)" line per option.
#
# Not here: `weights` - the unit passes --weights ${STRIX_WEIGHTS}, so a systemd drop-in can switch layouts.
#
# After editing: systemctl --user restart strix-server.service (no daemon-reload needed for this file).

# --- model files ---
# Defaults, under $STRIX_MODELS_DIR: ngram = converted/Qwen3.8-Flash-Next.ngram-q8/ngram.table (the int8 n-gram table),
# tokenizer = Qwen3.8-Flash-Next/tokenizer.json, generation-config = Qwen3.8-Flash-Next/generation_config.json (the
# sampling defaults - temperature 1.0, top_k 20, top_p 0.95 - when a request doesn't set them). Set any of them here
# as an absolute path to override.
model-id = qwen3.8-flash-next

# --- HTTP ---
host = 0.0.0.0
port = 5300

# --- forward ---
# Positions per session: 512k with YaRN factor 2 (below). Real agent sessions reach 490k (2026-10-02: compaction at
# 492,919, decode flat to it). ~13 GiB of KV + indexer keys at 512k.
capacity = 524288
# YaRN context extension, always on (2026-10-02; kernels/rope.hpp rope_yarn): 262,144 trained positions x 2.
# Quality at ordinary lengths measured no worse (job 30, dd04a23: NLL 1.4316 vs 1.4539 over 20 captures - inside the
# 0.054 per-capture noise floor - needles 78/80 vs 69/80), no speed cost (decode 30.86 ms both at 228k). Changing it
# drops the prompt cache's entries made under the other setting.
rope-yarn-factor = 2
# Prefill in 16384-token forwards: +3.0% / +2.8% vs 8192 on 65k / 131k-token prompts (1,507 -> 1,552, 1,467 -> 1,508
# t/s, alternated runs), the same greedy tokens after a 65k prefill. Earlier steps: 4096 -> 8192 +4.9%,
# 2048 -> 4096 +7.8%. The weights are read once a chunk; progress and cancellation are checked per chunk (~25 s at
# depth). 16384 is the session's maximum (32768 would pass 2^31 bytes in the experts' partials and needs the QSA
# scores sliced - est. +1.5-2%, not built).
chunk = 16384

# --- MTP drafting ---
mtp = on
# 5 drafts since 2026-10-01 (ea04844): teacher-forced replays of real traffic, 3 repeats (7692313-draftconf-*):
# -0.60% ms/token on terminal-bench / mixed captures, -0.74% on opencode turns vs 4.
mtp-draft = 5
# Draft while the top-1 logit margin is >= 2.0: gate sweep 7c6fcf1-gate, confirmed by 7692313-draftconf-* (margin
# 1.5 at 4 drafts slower on both traffic sets).
mtp-margin = 2
# Drafts scored over token ids [0, 65536) (sweeps 740bdd7 + c816938-k*, real text, 10 prompts).
mtp-vocab = 65536

# --- PLE n-gram row cache ---
# 8 M rows, ~2.7 GB of rows + ~0.5 GB of index (103eab5; the library default 2^18 rows is ~84 MB): 3-4 opencode
# sessions' worth (1.2-2.3 M distinct rows each), for cross-session reuse (2026-09-27; ~40 GB of RAM is free
# with the server up). Denser than the page cache it partly replaces (320 B rows vs 4 KiB pages). Restart cost
# measured negligible (2026-10-01).
ngram-cache-rows = 8388608

# --- prompt cache ---
# Directory: default $STRIX_MODELS_DIR/prompt-cache (prompt-cache-dir to override).
# Disk cap in GiB (0 = no prompt cache). The entries are the server's own: safe to delete while it is stopped.
prompt-cache-gib = 128
# Keep MemAvailable above 4 GiB (2026-10-08; was 24). 24 came from the switch test (dd56908): at 16, direct
# compaction at 23-27 GB available - exports 4-5 s, a RAM resume 9.6 s - caused by MADV_HUGEPAGE host buffers and
# buffered entry writes, both gone since e35f0c8 (4 KiB pages, O_DIRECT). At 512k capacity the server holds ~96 GiB of
# GPU memory, so 24 left the RAM tier empty from startup (MemAvailable 14-20 GiB; every entry dropped at once, and
# its write refused by the budget). 4 = kernel watermarks + services + room for one build. Switch test (a09d664 + the
# tally fix; two 264k conversations, chunk 16384, n-gram table warm): lowest MemAvailable 5.5 GiB, 0 compaction stalls,
# RAM resumes 1.2-1.4 s. An earlier run without make_room_for fell to 0.5 GB and hung the machine. 4 assumes the
# machine is dedicated to the server; one that also runs a desktop or another model: see strixite's Memory guide.
prompt-cache-ram-margin-gib = 4
# Disk writes kept low (2026-10-02: write less by default; a power failure losing the RAM tier - a longer first
# prefill after it - is acceptable). Measured before (58d0684, YaRN session 260k-420k, 19:33-22:30): 240 GB written
# in ~3 h (41 writes; 205 more refused by the 64 GiB/h budget) for 3 disk loads read back. The RAM tier serves
# switches; the disk mostly matters across restarts, and a clean stop still writes the newest entries (shutdown rule).
# An entry idle in RAM this long is written to disk (and kept in RAM): 1 h (was 600 s).
prompt-cache-idle-s = 3600
# Disk write budget for eviction and idle writes (0 = no limit): 8 GiB/h (was 64) - about one 300k-context entry an
# hour; delta entries (below) make per-conversation writes small.
# 2026-10-03 afternoon, 8 -> 32: two deep agents at once (opencode ~200k, Hermes ~95k; 512k capacity leaves the RAM
# tier at its margin) - 38 entries dropped for the budget in 2.3 h (avg 90k tokens) and Hermes' 95k conversation came
# back from its 15k system prefix three times, ~55 s of re-prefill each (journal 13:42-16:00, d3f5428). With delta
# entries most writes are bases; 24.6 GB were written in those 2.3 h at 8.
prompt-cache-write-gib-per-hour = 32
# A cache write never leaves less than this free on the cache's filesystem.
prompt-cache-disk-free-gib = 32
# Checkpoints kept per conversation.
prompt-cache-checkpoints = 2
# Delta entries (2026-10-03): a turn saves only what changed since the whole entry
# it extends while it adds <= 65536 tokens (and <= a quarter of that base): ~27 KiB a token + ~0.12 GB, vs the whole
# state every turn (11.5 GB at 410k, 2026-10-02 - 193 entries dropped for the write budget). 32768 -> 65536
# (2026-10-08): an opencode session 40k past its 190k base saved a whole 6.5 GB turn every request; the quarter rule
# now decides below a 262k base (a delta of <= ~1.4 GB there).
prompt-cache-delta-max-tokens = 65536

# --- serving behaviour ---
# The thinking nudge into a think block going in circles (serve/think_nudge.hpp, 390d575). Set off only for
# like-for-like comparisons with engines that don't have it.
think-nudge = on
# The think-block guard: <|im_end|> / <|endoftext|> are never sampled while the think block or a tool call is open.
# Without it the model ended turns mid thought when it meant to name a tag in inline code (`</tool_call>`): P(end of
# turn) 0.91-0.9997 right after the backtick (tools/eot_probe, 2026-10-09 opencode captures; the same on TheRock 10.1
# and 10.2) - and mid call, writing code like id_of("<|im_end|>") into an edit. Off only for like-for-like comparisons.
think-end-guard = on
# Literal tags: a </think> / <tool_call> / </tool_call> token not right after a newline is text, not structure. The
# model has no text spelling for its tags; every one of the 12 in the 2026-10-09 captures that didn't follow a newline was a
# literal (`id_of("<tool_call>")` in code, a tag named in a sentence), and the other 10,693 (all structural) followed one.
literal-tags = on
# When it fires: at least 25% of the last 1024 thinking tokens repeat earlier 8-grams, from 3072 thinking tokens on.
# On a full terminal-bench run it fired in 14 of ~550 requests and mostly ended the thinking within ~1.4k tokens.
# Nudging earlier (10% from 1024) was mostly ignored; a length-only trigger was removed (ignored, or it made the model
# answer inside the think block).
think-nudge-rate = 0.25
think-nudge-min-tokens = 3072
# Nudge 1's text: commit ("... commit to the most promising approach now and act on it"). decide ("... state my
# decision and the exact next command") ended thinking more often in fork tests (5 of 12 vs 3 of 12 within 2k tokens at
# the served trigger), but also wrote the answer inside the think block more often; on trial in terminal-bench arms.
think-nudge-wording = commit
# Thinking for requests that don't say: on (the model's default). off renders them without the think block - on
# terminal-bench that took 4-7x the steps and was no faster.
thinking = on
# Captures (capture-dir, serve/capture.hpp): every request's token ids and MTP steps, for offline studies. Off unless
# set; the files hold the prompts, so they stay on the serving machine.
